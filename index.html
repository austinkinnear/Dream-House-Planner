<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream House Layout Planner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f0f2f5;
            --grid-color: #e1e4e8;
            --primary-color: #3b82f6; /* Blue for Standard */
            --secondary-color: #10b981; /* Green for Special/Wellness */
            --tertiary-color: #8b5cf6; /* Purple for Entertainment */
            --outdoor-color: #0ea5e9; /* Cyan for Outdoor */
            --sport-color: #f59e0b;   /* Orange for Sports */
            --landscape-color: #65a30d; /* Lime/Green for Nature */
            --hallway-color: #9ca3af; /* Gray for Hallways */
            --utility-color: #64748b; /* Slate for Utility */
            --farm-color: #d97706; /* Brown/Amber for Farm */
            --text-color: #1f2937;
            --panel-width: 280px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Controls */
        #sidebar {
            width: var(--panel-width);
            background: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 20;
            overflow-y: auto;
            flex-shrink: 0;
        }

        h1 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--text-color); }
        h2 { font-size: 0.85rem; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
        
        .room-template {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .room-template:hover {
            border-color: var(--primary-color);
            background: #eff6ff;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .room-template .name { font-weight: 500; font-size: 0.9rem; }
        .room-template .dims { font-size: 0.75rem; color: #6b7280; }

        /* Main Viewport */
        #viewport {
            flex-grow: 1;
            position: relative;
            overflow: hidden; /* We handle panning/zooming via transform */
            background-color: #e5e5e5;
            cursor: grab;
        }

        #viewport:active {
            cursor: grabbing;
        }

        /* The Infinite World */
        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 8000px; /* Massive canvas */
            height: 8000px;
            background-color: white;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px; /* 1 grid cell = 2ft approx */
            transform-origin: 0 0;
            transition: transform 0.1s linear; /* Smooth zoom */
        }

        /* Toolbar */
        #toolbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            z-index: 100;
            align-items: center;
        }

        /* Stats Panel */
        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100;
            width: 220px;
            border: 1px solid #e5e7eb;
            pointer-events: none;
        }
        #stats-panel h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #1f2937; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.85rem; color: #4b5563; }
        .stat-row span:first-child { font-weight: 500; }
        .stat-total { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e5e7eb; font-weight: 700; color: var(--primary-color); }

        /* Room Elements on Canvas */
        .room {
            position: absolute;
            background: rgba(59, 130, 246, 0.15);
            border: 2px solid var(--primary-color);
            border-radius: 2px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: move;
            user-select: none;
            box-sizing: border-box; /* Includes border in W/H */
            font-size: 0.8rem;
            text-align: center;
            color: var(--primary-color);
            font-weight: 600;
            transition: box-shadow 0.2s, background 0.2s;
            overflow: hidden;
            z-index: 10;
        }

        .room:hover {
            z-index: 100 !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .room.selected {
            border: 2px solid #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
            z-index: 110 !important;
        }

        /* Fence Specific Style to fit text */
        .room[data-type="fence"] {
            font-size: 8px !important;
            line-height: 10px;
            border-width: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        /* Special Categories Styling */
        .room.special { background: rgba(16, 185, 129, 0.15); border-color: var(--secondary-color); color: var(--secondary-color); }
        .room.entertainment { background: rgba(139, 92, 246, 0.15); border-color: var(--tertiary-color); color: var(--tertiary-color); }
        .room.outdoor { background: rgba(14, 165, 233, 0.15); border-color: var(--outdoor-color); color: #0369a1; }
        .room.sport { background: rgba(245, 158, 11, 0.15); border-color: var(--sport-color); color: #b45309; }
        .room.landscape { background: rgba(101, 163, 13, 0.15); border-color: var(--landscape-color); color: #3f6212; }
        .room.farm { background: rgba(217, 119, 6, 0.15); border-color: var(--farm-color); color: #92400e; }
        .room.hallway { background: rgba(156, 163, 175, 0.15); border-color: var(--hallway-color); color: #4b5563; }
        .room.utility { background: rgba(100, 116, 139, 0.15); border-color: var(--utility-color); color: #334155; }

        /* BLUEPRINT MODE STYLES */
        body.blueprint-mode #world {
            background-image: 
                linear-gradient(#f0f0f0 1px, transparent 1px),
                linear-gradient(90deg, #f0f0f0 1px, transparent 1px);
            background-color: #fff;
        }
        body.blueprint-mode .room {
            background: white !important;
            border: 2px solid #000 !important;
            color: #000 !important;
            border-radius: 0;
            box-shadow: none;
        }
        body.blueprint-mode .room:hover {
            background: #f9fafb !important;
            box-shadow: inset 0 0 0 1px #000;
        }
        body.blueprint-mode .room.selected {
            box-shadow: 0 0 0 4px rgba(0,0,0,0.1);
        }


        /* Context Menu for Rooms */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            gap: 10px;
            z-index: 200;
            display: none; /* Hidden by default */
        }

        .btn {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #374151;
        }

        .btn:hover { background: #e5e7eb; }
        .btn.primary { background: var(--primary-color); color: white; border: none; }
        .btn.primary:hover { background: #2563eb; }
        .btn.success { background: var(--secondary-color); color: white; border: none; }
        .btn.success:hover { background: #059669; }
        .btn.danger { color: #dc2626; background: #fee2e2; border-color: #fecaca; }
        .btn.danger:hover { background: #fecaca; }

        /* AI Buttons */
        .btn-ai {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s, transform 0.1s;
            margin-bottom: 8px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
